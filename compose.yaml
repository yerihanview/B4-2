
services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: b4-2-agent:local
    container_name: b4-2-agent

    environment:
      AGENT_HOME: /home/agent/agent-app
      AGENT_PORT: "15034"
      AGENT_UPLOAD_DIR: /home/agent/agent-app/upload_files
      AGENT_KEY_PATH: /home/agent/agent-app/api_keys
      AGENT_LOG_DIR: /home/agent/agent-app/logs
      MEMORY_LIMIT: "${MEMORY_LIMIT}"
      CPU_MAX_OCCUPY: "${CPU_MAX_OCCUPY}"
      MULTI_THREAD_ENABLE: "${MULTI_THREAD_ENABLE}"

    ports:
      - "127.0.0.1:15034:15034"

    volumes:
      - ./runtime/api_keys:/home/agent/agent-app/api_keys:ro
      - ./runtime/logs:/home/agent/agent-app/logs

    restart: "no"
    init: true
